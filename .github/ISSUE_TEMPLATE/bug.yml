name: Bug report
description: Report a reproducible behavior problem (no secrets or vulnerability details).
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include Node version, command, expected and actual behavior. Redact credentials.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant test output
